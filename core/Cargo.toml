[package]
name = "tunnel_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hybrid X25519 + ML-KEM-768 tunnel crypto, shared by the relay and the Android app"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
ml-kem = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
